[project]
name = "jupyter"
version = "0.5.3"
description = "A basic image with jupyterlab and server-documents"
requires-python = ">=3.12"
dependencies = [
    # Floor of 0.3.0, not 0.2.4: only 0.3.x accepts the ydoc-4 RTC frontends
    # (jupyter-collaboration-ui / jupyter-docprovider 3.x) that JupyterLab 4.6
    # requires. Pinning the floor here rather than trusting the resolver to pick
    # the newest is what keeps the pair deterministic — a 0.2.x resolution would
    # drag in ydoc-^3 frontends and silently reintroduce jupyter-deploy#303.
    "jupyter-server-documents>=0.3.0",
    "jupyterlab>=4.6",
]
